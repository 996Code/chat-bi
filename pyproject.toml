[project]
name = "chatbi-v2"
version = "0.1.0"
description = "ChatBI v2 - Natural Language to SQL BI Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "cryptography>=42.0.0",
    "sqlglot>=25.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pymilvus>=2.4.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "--strict-markers"
pythonpath = ["backend"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.coverage.run]
source = ["backend/app"]
omit = [
    "backend/app/__init__.py",
    # 客户端封装: 连接层，需真实 Redis/Milvus 才能测，留待集成测试
    "backend/app/core/redis_client.py",
    "backend/app/core/milvus_client.py",
    # logging 配置: 副作用难单测，用日志行为覆盖
    "backend/app/core/logging.py",
]

[tool.coverage.report]
# 覆盖率门禁: 低于此值 CI 失败 (coverage report --fail-under 退出码非 0)
# 设在略低于当前真实水平的安全线，防止测试倒退；随测试补充逐步抬高
fail_under = 75
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
