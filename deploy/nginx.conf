upstream backend {
    server 127.0.0.1:8000;
}

server {
    listen 28080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API — proxy to uvicorn
    location /chat-bi/api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming: disable buffering, enable chunked transfer
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    # Health check — proxy to backend (rewrite /chat-bi/health → /health)
    location = /chat-bi/health {
        proxy_pass http://backend/health;
    }

    # Frontend static assets (Vite build output)
    location /chat-bi/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend SPA
    location /chat-bi/ {
        try_files $uri $uri/ /index.html;
    }

    # Root redirect to /chat-bi/
    location = / {
        return 301 /chat-bi/;
    }
}
