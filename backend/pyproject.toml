[project]
name = "chatbi-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "aiomysql>=0.2",
    "alembic>=1.14",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "cryptography>=43",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "httpx>=0.27",
    "sqlglot>=25.0",
    "chromadb>=0.5",
    "email-validator>=2.2",
    "itsdangerous>=2.2",
    "aiosmtplib>=3.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.1", "pytest-asyncio>=0.24", "ruff>=0.7"]
