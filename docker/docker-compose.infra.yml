# ============================================================
# ChatBI v2 — 本地基础设施（仅数据服务，不含 backend/frontend）
#
# 位置: docker/ 目录下。部署/容器相关文件统一收拢于此。
#
# 用法（在项目根执行）:
#   docker compose -f docker/docker-compose.infra.yml up -d        # 启动
#   docker compose -f docker/docker-compose.infra.yml ps           # 状态
#   docker compose -f docker/docker-compose.infra.yml logs -f      # 日志
#   docker compose -f docker/docker-compose.infra.yml down         # 停止（保留数据）
#   rm -rf docker/data/                                            # 彻底清理数据
#
# 服务:
#   - postgres  pgvector/pgvector:pg16  :5432  (pgvector 扩展已内置)
#   - etcd      Milvus 依赖
#   - minio     Milvus 对象存储          :9000/:9001
#   - milvus    向量库                   :19530/:9091
#
# 凭证: root/root/chat-bi（部署后需同步到 backend/.env 的 DATABASE_URL）
#
# 数据: 全部 bind mount 到 docker/data/<service>/（非 docker volume），
#        down 后删除 docker/data/ 即彻底清理；docker/data/ 已加入 .gitignore
# ============================================================

services:
  # ── PostgreSQL (pgvector) ────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbi-infra-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: chat-bi
    ports:
      - "5432:5432"
    volumes:
      # bind mount → 数据落在 docker/data/postgres/，down 后删目录即彻底清理
      - ./data/postgres:/var/lib/postgresql/data
      # PG 首次启动时自动执行（建 pgvector 扩展）；init SQL 在 docker/ 下自包含
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d chat-bi"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Milvus 依赖: etcd ───────────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: chatbi-infra-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      # bind mount → ./data/etcd/
      - ./data/etcd:/etcd
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ── Milvus 依赖: minio (对象存储) ───────────────────────────
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: chatbi-infra-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"   # 管理控制台
      - "9000:9000"   # S3 API
    volumes:
      # bind mount → ./data/minio/
      - ./data/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ── Milvus (向量库) ─────────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: chatbi-infra-milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"  # gRPC（pymilvus 连这个）
      - "9091:9091"    # 健康检查 / 管理界面
    volumes:
      # bind mount → ./data/milvus/
      - ./data/milvus:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s   # Milvus standalone 首次启动较慢
      timeout: 20s
      retries: 3
    restart: unless-stopped

# （bind mount 无需顶层 volumes 声明）
