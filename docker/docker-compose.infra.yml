# ============================================================
# ChatBI v2 — 基础设施（仅数据服务：PG / Redis / Milvus）
#
# 与 docker-compose.app.yml 配合使用（同目录）：
#   开发只起基础设施:  docker compose -f docker/docker-compose.infra.yml up -d
#   完整部署（含业务）: docker compose \
#       -f docker/docker-compose.infra.yml \
#       -f docker/docker-compose.app.yml up -d
#
# 服务:
#   postgres  pgvector/pgvector:pg16  :5432  (pgvector 扩展内置)
#   redis     redis:7-alpine          (仅容器内访问, 不暴露端口)
#   etcd/minio/milvus                 :19530/:9091
#
# 数据: 全部 bind mount 到 ./data/<service>/（相对此文件目录），
#        down 后删除 docker/data/ 即彻底清理；已在 .gitignore。
# ============================================================

services:
  # ── PostgreSQL (pgvector) ────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-chatbi}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-chatbi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis (缓存/限流/分布式锁) ───────────────────────────────
  # 本地开发: 后端跑在宿主机, 需映射 6379 到宿主机
  # 生产部署: backend 在容器网络内用容器名 redis:6379, 端口可不映射 (按需删 ports)
  redis:
    image: redis:7-alpine
    container_name: chatbi-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_pass}
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Milvus 依赖: etcd ───────────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: chatbi-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./data/etcd:/etcd
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ── Milvus 依赖: minio (对象存储) ───────────────────────────
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: chatbi-minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9001:9001"   # 管理控制台
      - "9000:9000"   # S3 API
    volumes:
      - ./data/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ── Milvus (向量库) ─────────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: chatbi-milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "19530:19530"  # gRPC（pymilvus 连这个）
      - "9091:9091"    # 健康检查 / 管理界面
    volumes:
      - ./data/milvus:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s   # Milvus standalone 首次启动较慢
      timeout: 20s
      retries: 3
    restart: unless-stopped

# （bind mount 用相对路径 ./data/, 无需顶层 volumes 声明）
