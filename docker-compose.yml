# ============================================================
# ChatBI v2 — Docker Compose 完整部署
#
# 包含所有服务: PG + Redis + Milvus(etcd+minio) + Backend + Frontend + Sample DB
# 对外端口仅暴露: 8999(backend), 28080(frontend)
# 其余服务不暴露端口, 容器内通过服务名通信
#
# 用法:
#   cp deploy/.env.example deploy/.env  → 填配置
#   ./deploy.sh                           # 一键部署 (含自动初始化)
#   ./deploy.sh --init                    # 仅初始化数据
# ============================================================

services:
  # ── PostgreSQL (元数据库 + pgvector) ──────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-chatbi}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    networks:
      - chatbi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-chatbi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── 业务演示库 (电商示例数据, 121 张表) ──────────────────────
  # 首次启动自动执行 ecom_demo.sql (DDL+DML)
  sample-db:
    image: postgres:16-alpine
    container_name: chatbi-sample-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SAMPLE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SAMPLE_DB_PASSWORD:-sample_pass}
      POSTGRES_DB: ${SAMPLE_DB_NAME:-chatbi_ecom}
    volumes:
      - sample-db-data:/var/lib/postgresql/data
      - ./backend/scripts/ecom_demo.sql:/docker-entrypoint-initdb.d/01-ecom-demo.sql:ro
    networks:
      - chatbi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SAMPLE_DB_USER:-postgres} -d ${SAMPLE_DB_NAME:-chatbi_ecom}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chatbi-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_pass}
      --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - chatbi
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Milvus 依赖: etcd ───────────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: chatbi-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0.2379
      --data-dir /etcd
    networks:
      - chatbi
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── Milvus 依赖: minio ──────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: chatbi-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - chatbi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── Milvus (向量库) ─────────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: chatbi-milvus
    restart: unless-stopped
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus-data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - chatbi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # ── Backend (FastAPI) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbi-backend
    restart: unless-stopped
    ports:
      - "8999:8999"
    env_file:
      - deploy/.env
    environment:
      # 容器内用服务名连接
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-chatbi}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      MILVUS_URL: http://milvus:19530
      SAMPLE_DB_HOST: sample-db
      SAMPLE_DB_PORT: "5432"
    volumes:
      - backend-logs:/app/logs
      - backend-data:/app/data
    networks:
      - chatbi
    depends_on:
      postgres:
        condition: service_healthy
      sample-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8999/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Frontend (Vue 3 + Nginx) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbi-frontend
    restart: unless-stopped
    ports:
      - "28080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - chatbi
    depends_on:
      backend:
        condition: service_healthy

  # ── 一次性初始化 (仅 --profile init 时触发) ──────────────────
  # 建库 + 灌数据: 元数据(租户+admin+数据源) + 业务演示数据
  # 幂等: 已有数据则跳过, 可安全重复执行
  # 扫描/记忆等需 LLM 的操作留给用户在前端手动触发
  init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbi-init
    env_file:
      - deploy/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-chatbi}
      SAMPLE_DB_HOST: sample-db
      SAMPLE_DB_PORT: "5432"
    networks:
      - chatbi
    depends_on:
      postgres:
        condition: service_healthy
      sample-db:
        condition: service_healthy
    command: >
      sh -c "
        echo '=== 1. 初始化元数据 ===' &&
        python scripts/seed_meta.py &&
        echo '=== 2. 补充业务演示数据 ===' &&
        python scripts/seed_ecom_data.py &&
        echo '=== 初始化完成 ===' &&
        echo '' &&
        echo '下一步: 前端登录 → 数据源页扫描 → 聊天页提问'
      "
    profiles: ["init"]
    restart: "no"

volumes:
  postgres-data:
  sample-db-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  backend-logs:
  backend-data:

networks:
  chatbi:
